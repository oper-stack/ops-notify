name: ops-notify

# Репозиторий публичный, и для публичных репозиториев минуты Actions бесплатны без
# ограничений. Поэтому расписания здесь снова частые: почта раз в десять минут, очередь
# раз в пять. Если репозиторий когда-нибудь снова закроют, это первое, что придётся
# разредить: на бесплатном плане организации 2000 минут в месяц, GitHub округляет каждое
# задание вверх до минуты, и замер от 14.09.2026 показал 177 минут в сутки при таких же
# расписаниях, то есть лимит кончался бы за неделю.
#
# Настоящую работу очереди в любом случае даёт сам сайт через workflow_dispatch сразу по
# заявке, а расписание это подстраховка. Если разбудить не вышло, в таблице лидов вместо
# «очередь разбужена» пишется «отчёт в очереди»: по этой колонке и видно, что она понадобилась.
on:
  schedule:
    - cron: '*/10 * * * *'   # почта в Telegram, раз в десять минут (GitHub может задержать)
    - cron: '0 12 * * *'     # daily digest at 12:00 UTC, 09:00 Argentina
    - cron: '0 6 * * *'      # продукты: прогон того, что продаём, на своём сайте, 06:00 UTC
    - cron: '*/5 * * * *'    # очередь отчётов: подстраховка раз в пять минут. Обычно её будит сам сайт, сразу по заявке
    - cron: '0 10 * * *'     # цепочка писем после бесплатной проверки, 10:00 UTC
    - cron: '30 10 * * *'    # наблюдение: еженедельные срезы за 29 и перепроверка через 90 дней, 10:30 UTC
  workflow_dispatch:
    inputs:
      job:
        description: 'mail, digest, smoke, report, sequence or watch'
        default: 'mail'
      # Цепочка пишет живым людям. Проверять её «запустим и посмотрим» нельзя: письмо уже ушло.
      # Сухой прогон показывает, кому и какое письмо ушло бы, и не отправляет ничего.
      dry:
        description: 'сухой прогон: показать, что ушло бы, и ничего не отправлять'
        type: boolean
        default: false
      register:
        description: 'наблюдение: записать строку (JSON: kind, email, url, lang, rivals, registeredAt)'
        default: ''

jobs:
  mail:
    if: github.event.schedule == '*/10 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'mail')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node notify-mail.mjs
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # Служебные письма сайта самому себе убираем из «Входящих» под ярлык. Строго после разбора
      # выше: сначала письмо посмотрели, потом убрали.
      - run: node tidy-tests.mjs
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}

  digest:
    if: github.event.schedule == '0 12 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'digest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node digest.mjs
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    # Проверяем свои же продукты на своём сайте. Телеметрии из чужих прогонов у нас нет и не будет:
    # актор публичный, и слать нам адреса чужих сайтов это не мониторинг, а сбор чужих данных.
    if: github.event.schedule == '0 6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Проверке настоящего браузера нужен сам пакет, а не только его команда: она открывает
      # страницу тем же кодом, которым её открывает отчёт. Остальные проверки по-прежнему берут
      # пакет из сети через npx, то есть ровно так, как его получает покупатель.
      - run: npm ci --omit=dev
      - run: node product-smoke.mjs
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  report:
    # Очередь отчётов за 9 долларов. Заявка приходит служебным письмом с oper-stack.com, здесь она
    # выполняется и покупателю уходит PDF. Chrome на ubuntu-latest уже стоит: он и печатает отчёт,
    # и меряет, сколько текста пропадает без скриптов.
    if: github.event.schedule == '*/5 * * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'report')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: operstack-report-queue
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node report-watch.mjs
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          KIT_DOWNLOAD_SECRET: ${{ secrets.KIT_DOWNLOAD_SECRET }}
          SHEETS_SA_EMAIL: ${{ secrets.SHEETS_SA_EMAIL }}
          SHEETS_SA_KEY: ${{ secrets.SHEETS_SA_KEY }}
          FREE_CHECKS_SHEET_ID: ${{ secrets.FREE_CHECKS_SHEET_ID }}
          # Скрытый тариф за 19: без него первое английское письмо уходит без блока со скидкой,
          # хотя письмо 2 через сутки говорит «осталось четыре часа на цену 19». Русскому письму
          # переменная не нужна, там скидку подтверждает подпись, поэтому пропажа была видна
          # только на английской стороне.
          WHOP_CHECKOUT_RIVALS_19: ${{ vars.WHOP_CHECKOUT_RIVALS_19 }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      # Уборка идёт и здесь, а не только в задании про почту. Очередь просыпается по каждой
      # заявке, то есть ровно тогда, когда в ящике появляется новое письмо от нас самим себе.
      # Ждать общего расписания значит держать это письмо у владельца ящика на глазах.
      - run: node tidy-tests.mjs
        if: always()
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}

  sequence:
    # Цепочка писем после бесплатной проверки. Раз в сутки: расписание письма считается в часах
    # от первого прогона человека, окна широкие, и пропущенный день никого не оставит без письма.
    # Кому что уже ушло, помнит сама таблица, поэтому повторный запуск безопасен.
    if: github.event.schedule == '0 10 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'sequence')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: operstack-email-sequence
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node sequence-run.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry-run' || '' }}
        env:
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          KIT_DOWNLOAD_SECRET: ${{ secrets.KIT_DOWNLOAD_SECRET }}
          SHEETS_SA_EMAIL: ${{ secrets.SHEETS_SA_EMAIL }}
          SHEETS_SA_KEY: ${{ secrets.SHEETS_SA_KEY }}
          FREE_CHECKS_SHEET_ID: ${{ secrets.FREE_CHECKS_SHEET_ID }}
          WHOP_CHECKOUT_RIVALS_19: ${{ vars.WHOP_CHECKOUT_RIVALS_19 }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

  watch:
    # Наблюдение: четыре еженедельных среза для ступени «Против конкурентов» и перепроверка через
    # 90 дней для аудита. Память это лист «Наблюдение» в той же таблице, что у цепочки писем.
    if: github.event.schedule == '30 10 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'watch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: operstack-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - run: node watch-run.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.dry) && '--dry-run' || '' }}
        env:
          WATCH_REGISTER: ${{ github.event_name == 'workflow_dispatch' && inputs.register || '' }}
          GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
          GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
          KIT_DOWNLOAD_SECRET: ${{ secrets.KIT_DOWNLOAD_SECRET }}
          SHEETS_SA_EMAIL: ${{ secrets.SHEETS_SA_EMAIL }}
          SHEETS_SA_KEY: ${{ secrets.SHEETS_SA_KEY }}
          FREE_CHECKS_SHEET_ID: ${{ secrets.FREE_CHECKS_SHEET_ID }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
