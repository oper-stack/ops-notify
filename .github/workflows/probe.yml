name: probe-sources
on:
  push:
    branches: [cc/radar-free]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить, какие бесплатные поиски отвечают с серверов GitHub
        run: |
          for u in \
            "https://public.api.bsky.app/xrpc/app.bsky.feed.searchPosts?q=vibecoding&limit=3" \
            "https://www.reddit.com/search.json?q=vibecoding&sort=new&limit=3" \
            "https://hn.algolia.com/api/v1/search_by_date?query=vibecoding&hitsPerPage=3" \
            "https://lobste.rs/search.json?q=llms.txt" ; do
            code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -m 25 -A "operstack-radar/1.0" "$u" || echo "сеть")
            size=$(wc -c < /tmp/out.json 2>/dev/null || echo 0)
            head1=$(head -c 60 /tmp/out.json | tr -d '\n')
            echo "КОД $code | $size байт | ${u:0:52}"
            echo "     начало: $head1"
          done
